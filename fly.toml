# fly.toml — API deploy config (T7.4). Run `fly launch --no-deploy` once to
# create the app and adopt this file, then see docs/DEPLOYMENT.md for the
# full step-by-step (secrets, Postgres, first deploy).
app = "showroom-copilot-api"
primary_region = "bom"  # Mumbai — closest region to the Volvo India dealerships this is built for

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
