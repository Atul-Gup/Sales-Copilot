repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies:
          [
            fastapi>=0.115,
            pydantic>=2.9,
            pydantic-settings>=2.5,
            sqlalchemy>=2.0,
            pytest>=8.3,
          ]
        files: ^api/
