[project]
name = "showroom-copilot"
version = "0.1.0"
description = "Showroom Copilot — sales consultant assistant for Volvo Cars India dealerships"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
    "alembic>=1.13",
    "openpyxl>=3.1",
    "openai>=1.0",
    "pgvector>=0.3",
    "pypdf>=5.0",
    "rank-bm25>=0.2",
    "langgraph>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "types-openpyxl>=3.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api*", "ingest*", "evals*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["api", "ingest", "evals"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Embeds a full HTML/CSS/JS dashboard page as a Python string literal
# (api/routers/admin.py::_DASHBOARD_HTML) — line length there follows normal
# HTML/CSS/JS formatting conventions, not this project's 100-col Python rule.
"api/routers/admin.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom is `param: T = Depends(get_t)` —
# a call in a default argument that's meant to run once per request, not
# the mutable-default-argument bug B008 exists to catch.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["api", "ingest", "evals", "scripts"]

[[tool.mypy.overrides]]
module = "rank_bm25"
ignore_missing_imports = true
