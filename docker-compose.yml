services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: showroom
      POSTGRES_PASSWORD: showroom
      POSTGRES_DB: showroom_copilot
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U showroom -d showroom_copilot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
